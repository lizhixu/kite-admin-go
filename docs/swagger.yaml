basePath: /
definitions:
  controllers.LoginRequest:
    properties:
      captcha:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captcha
    - password
    - username
    type: object
  controllers.bulkIDsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  controllers.bulkJobsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/controllers.jobRequest'
        type: array
    type: object
  controllers.bulkToggleRequest:
    properties:
      enabled:
        type: boolean
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  controllers.createFolderRequest:
    properties:
      configId:
        type: integer
      name:
        type: string
      parentId:
        type: integer
    required:
    - configId
    - name
    type: object
  controllers.createMessageRequest:
    properties:
      content:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      targetType:
        enum:
        - ALL
        - USER
        - ROLE
        type: string
      title:
        type: string
      type:
        enum:
        - SYSTEM
        - NOTICE
        - ANNOUNCEMENT
        type: string
      userIds:
        items:
          type: integer
        type: array
    required:
    - content
    - targetType
    - title
    - type
    type: object
  controllers.createPermissionRequest:
    properties:
      code:
        type: string
      component:
        type: string
      description:
        type: string
      enable:
        type: boolean
      icon:
        type: string
      keepAlive:
        type: boolean
      layout:
        type: string
      method:
        type: string
      name:
        type: string
      order:
        type: integer
      parentId:
        type: integer
      path:
        type: string
      redirect:
        type: string
      show:
        type: boolean
      type:
        type: string
    required:
    - code
    - name
    - type
    type: object
  controllers.createRoleRequest:
    properties:
      code:
        type: string
      enable:
        type: boolean
      name:
        type: string
      permissionIds:
        items:
          type: integer
        type: array
    required:
    - code
    - name
    type: object
  controllers.createUserRequest:
    properties:
      address:
        type: string
      avatar:
        type: string
      email:
        type: string
      enable:
        type: boolean
      gender:
        type: integer
      nickName:
        type: string
      password:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      username:
        type: string
    required:
    - password
    - username
    type: object
  controllers.emailConfigRequest:
    properties:
      enabled:
        type: boolean
      fromEmail:
        type: string
      fromName:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      username:
        type: string
    required:
    - fromEmail
    - fromName
    - host
    - port
    - username
    type: object
  controllers.jobRequest:
    properties:
      delayUntil:
        type: string
      maxRetries:
        type: integer
      payload:
        type: string
      priority:
        type: integer
      uniqueKey:
        type: string
    type: object
  controllers.moveMediaRequest:
    properties:
      folderId:
        type: integer
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  controllers.previewEmailTemplateRequest:
    properties:
      vars:
        additionalProperties:
          type: string
        type: object
    type: object
  controllers.queueUpdateRequest:
    properties:
      concurrency:
        type: integer
      description:
        type: string
      maxRetries:
        type: integer
      status:
        type: string
      timeout:
        type: integer
    type: object
  controllers.renameFolderRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  controllers.resetPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  controllers.roleUsersRequest:
    properties:
      userIds:
        items:
          type: integer
        type: array
    required:
    - userIds
    type: object
  controllers.storageConfigRequest:
    properties:
      accessKey:
        type: string
      allowExtensions:
        type: string
      bucket:
        type: string
      customDomain:
        type: string
      enabled:
        type: boolean
      endpoint:
        type: string
      isDefault:
        type: boolean
      localDir:
        type: string
      maxSizeMB:
        type: integer
      name:
        type: string
      publicPrefix:
        type: string
      region:
        type: string
      secretKey:
        type: string
      type:
        enum:
        - LOCAL
        - S3
        type: string
      useSSL:
        type: boolean
    required:
    - name
    - type
    type: object
  controllers.systemConfigRequest:
    properties:
      copyright:
        type: string
      favicon:
        type: string
      logo:
        type: string
      siteName:
        type: string
    required:
    - siteName
    type: object
  controllers.taskRequest:
    properties:
      command:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      httpBody:
        type: string
      httpHeaders:
        type: string
      httpMethod:
        type: string
      name:
        type: string
      spec:
        type: string
      timeout:
        type: integer
      type:
        enum:
        - HTTP
        - SHELL
        - FUNC
        type: string
    required:
    - command
    - name
    - spec
    - type
    type: object
  controllers.updateEmailTemplateRequest:
    properties:
      content:
        type: string
      name:
        type: string
      subject:
        type: string
    required:
    - content
    - name
    - subject
    type: object
  controllers.updatePermissionRequest:
    properties:
      code:
        type: string
      component:
        type: string
      description:
        type: string
      enable:
        type: boolean
      icon:
        type: string
      keepAlive:
        type: boolean
      layout:
        type: string
      method:
        type: string
      name:
        type: string
      order:
        type: integer
      parentId:
        type: integer
      path:
        type: string
      redirect:
        type: string
      show:
        type: boolean
      type:
        type: string
    type: object
  controllers.updateProfileRequest:
    properties:
      address:
        type: string
      avatar:
        type: string
      email:
        type: string
      gender:
        type: integer
      nickName:
        type: string
    type: object
  controllers.updateRoleRequest:
    properties:
      code:
        type: string
      enable:
        type: boolean
      name:
        type: string
      permissionIds:
        items:
          type: integer
        type: array
    type: object
  controllers.updateUserRequest:
    properties:
      address:
        type: string
      avatar:
        type: string
      email:
        type: string
      enable:
        type: boolean
      gender:
        type: integer
      nickName:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      username:
        type: string
    type: object
  models.EmailConfig:
    properties:
      enabled:
        type: boolean
      fromEmail:
        type: string
      fromName:
        type: string
      host:
        type: string
      id:
        type: integer
      port:
        type: integer
      username:
        type: string
    type: object
  models.EmailTemplate:
    properties:
      content:
        type: string
      createTime:
        type: string
      id:
        type: integer
      isBuiltin:
        type: boolean
      name:
        type: string
      scene:
        type: string
      subject:
        type: string
      updateTime:
        type: string
    type: object
  models.LoginLog:
    properties:
      createTime:
        type: string
      id:
        type: integer
      ip:
        type: string
      message:
        type: string
      success:
        type: boolean
      userAgent:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  models.Media:
    properties:
      accessUrl:
        type: string
      bizType:
        description: 空 = 媒体库素材；其它如 avatar/rich-text/message-attach 为业务上传
        type: string
      configId:
        type: integer
      createTime:
        type: string
      ext:
        type: string
      filename:
        type: string
      folderId:
        description: 0 = 该存储的根目录
        type: integer
      folderPath:
        description: 冗余，便于前端展示与过滤
        type: string
      id:
        type: integer
      mimeType:
        type: string
      size:
        type: integer
      storageKey:
        type: string
      storageType:
        description: LOCAL / S3
        type: string
      uploaderId:
        type: integer
      uploaderName:
        type: string
    type: object
  models.MediaFolder:
    properties:
      configId:
        type: integer
      createTime:
        type: string
      id:
        type: integer
      name:
        type: string
      parentId:
        description: nil = 根
        type: integer
      path:
        description: 如 "photos/2024"
        type: string
      updateTime:
        type: string
    type: object
  models.Message:
    properties:
      content:
        type: string
      createTime:
        type: string
      id:
        type: integer
      senderId:
        type: integer
      senderName:
        type: string
      status:
        type: string
      targetRoles:
        description: JSON array of role IDs, e.g. "[1,2]"
        type: string
      targetType:
        type: string
      title:
        type: string
      type:
        type: string
      updateTime:
        type: string
    type: object
  models.PageData:
    properties:
      pageData: {}
      total:
        type: integer
    type: object
  models.Permission:
    properties:
      children:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
      code:
        type: string
      component:
        type: string
      description:
        type: string
      enable:
        type: boolean
      icon:
        type: string
      id:
        type: integer
      keepAlive:
        type: boolean
      layout:
        type: string
      method:
        type: string
      name:
        type: string
      order:
        type: integer
      parentId:
        type: integer
      path:
        type: string
      redirect:
        type: string
      show:
        type: boolean
      type:
        description: MENU, BUTTON
        type: string
    type: object
  models.Profile:
    properties:
      address:
        type: string
      avatar:
        type: string
      email:
        type: string
      gender:
        type: integer
      id:
        type: integer
      nickName:
        type: string
      userId:
        type: integer
    type: object
  models.Queue:
    properties:
      completedJobs:
        type: integer
      concurrency:
        type: integer
      createTime:
        type: string
      description:
        type: string
      failedJobs:
        type: integer
      id:
        type: integer
      maxRetries:
        type: integer
      name:
        type: string
      status:
        description: RUNNING / PAUSED
        type: string
      timeout:
        type: integer
      totalJobs:
        type: integer
      updateTime:
        type: string
    type: object
  models.QueueJob:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      delayUntil:
        type: string
      duration:
        type: integer
      error:
        type: string
      id:
        type: integer
      maxRetries:
        type: integer
      payload:
        type: string
      priority:
        type: integer
      queueId:
        type: integer
      result:
        type: string
      retryCount:
        type: integer
      startedAt:
        type: string
      status:
        type: string
      uniqueKey:
        type: string
    type: object
  models.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      originUrl:
        type: string
    type: object
  models.Role:
    properties:
      code:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  models.StorageConfig:
    properties:
      accessKey:
        type: string
      allowExtensions:
        description: 通用
        type: string
      bucket:
        type: string
      createTime:
        type: string
      customDomain:
        type: string
      enabled:
        type: boolean
      endpoint:
        description: S3
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      localDir:
        description: LOCAL
        type: string
      maxSizeMB:
        type: integer
      name:
        type: string
      publicPrefix:
        type: string
      region:
        type: string
      type:
        description: LOCAL / S3
        type: string
      updateTime:
        type: string
      useSSL:
        type: boolean
    type: object
  models.SysLog:
    properties:
      createTime:
        type: string
      id:
        type: integer
      ip:
        type: string
      latency:
        description: in milliseconds
        type: integer
      method:
        type: string
      params:
        type: string
      path:
        type: string
      response:
        type: string
      statusCode:
        type: integer
      userAgent:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  models.SystemConfig:
    properties:
      copyright:
        type: string
      createTime:
        type: string
      favicon:
        type: string
      id:
        type: integer
      logo:
        type: string
      siteName:
        type: string
      updateTime:
        type: string
    type: object
  models.Task:
    properties:
      command:
        description: URL / shell 命令 / 内置函数名
        type: string
      createTime:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      httpBody:
        type: string
      httpHeaders:
        description: JSON 字符串：{"K":"V"}
        type: string
      httpMethod:
        type: string
      id:
        type: integer
      lastRunAt:
        type: string
      name:
        type: string
      nextRunAt:
        type: string
      spec:
        description: 标准 5 段 cron 表达式
        type: string
      timeout:
        description: 秒
        type: integer
      type:
        description: HTTP / SHELL / FUNC
        type: string
      updateTime:
        type: string
    type: object
  models.TaskLog:
    properties:
      duration:
        description: 毫秒
        type: integer
      endTime:
        type: string
      error:
        type: string
      id:
        type: integer
      output:
        type: string
      startTime:
        type: string
      status:
        description: SUCCESS / FAILED / TIMEOUT
        type: string
      steps:
        description: 'JSON: [{time, level, message}]'
        type: string
      taskId:
        type: integer
      taskName:
        type: string
      trigger:
        description: CRON / MANUAL
        type: string
    type: object
  models.User:
    properties:
      createTime:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      profile:
        $ref: '#/definitions/models.Profile'
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      updateTime:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: kite-admin 后台管理系统 API 文档
  title: Kite Admin API
  version: "1.0"
paths:
  /auth/captcha:
    get:
      description: 获取图形验证码，验证码ID通过Cookie返回
      produces:
      - image/png
      responses:
        "200":
          description: 验证码图片
          schema:
            type: string
      summary: 获取验证码
      tags:
      - 认证管理
  /auth/current-role/switch/{roleCode}:
    post:
      description: 切换当前用户的角色，返回新的Token
      parameters:
      - description: 角色编码
        in: path
        name: roleCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，data包含accessToken
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: 生成Token失败
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 切换当前角色
      tags:
      - 认证管理
  /auth/login:
    post:
      consumes:
      - application/json
      description: 通过用户名、密码和验证码登录系统
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，data包含accessToken
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.Response'
      summary: 用户登录
      tags:
      - 认证管理
  /auth/logout:
    post:
      description: 退出登录（客户端应清除Token）
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证管理
  /email-template/{id}:
    get:
      description: 根据ID获取邮件模板详情
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.EmailTemplate'
              type: object
        "404":
          description: 模板不存在
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 获取邮件模板详情
      tags:
      - 邮件模板
    put:
      consumes:
      - application/json
      description: 更新指定邮件模板的内容
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      - description: 模板信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.updateEmailTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.EmailTemplate'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: 模板不存在
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 更新邮件模板
      tags:
      - 邮件模板
  /email-template/{id}/preview:
    post:
      consumes:
      - application/json
      description: 使用变量渲染邮件模板并返回预览
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      - description: 模板变量
        in: body
        name: body
        schema:
          $ref: '#/definitions/controllers.previewEmailTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，data包含subject和htmlBody
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: 模板不存在
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 预览邮件模板
      tags:
      - 邮件模板
  /email-template/list:
    get:
      description: 获取所有邮件模板
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.EmailTemplate'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取邮件模板列表
      tags:
      - 邮件模板
  /email/config:
    get:
      description: 获取当前邮件服务配置
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.EmailConfig'
              type: object
      security:
      - BearerAuth: []
      summary: 获取邮件配置
      tags:
      - 邮件配置
    put:
      consumes:
      - application/json
      description: 创建或更新邮件服务配置
      parameters:
      - description: 配置信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.emailConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.EmailConfig'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 保存邮件配置
      tags:
      - 邮件配置
  /email/config/test:
    post:
      description: 发送测试邮件到当前用户的邮箱
      produces:
      - application/json
      responses:
        "200":
          description: 测试邮件已加入队列
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: 配置未启用或未绑定邮箱
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - BearerAuth: []
      summary: 测试邮件配置
      tags:
      - 邮件配置
  /loginlog/list:
    get:
      description: 分页查询登录成功日志，支持按用户名筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: pageNo
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名（模糊搜索）
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  allOf:
